# Nova AI - Nginx reverse proxy konfiqurasiyası
# Yerləşdirmə: /etc/nginx/sites-available/nova-ai (sonra sites-enabled-ə symlink et)
#
# Bu fayl domenini backend-ə (127.0.0.1:8000) yönləndirir və WebSocket-i dəstəkləyir.
# SSL sertifikatı üçün Certbot istifadə et (aşağıda README-də izah olunub).

server {
    listen 80;
    server_name your-domain.com;   # <-- öz domenini bura yaz

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket dəstəyi (səsli söhbət üçün vacibdir)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
